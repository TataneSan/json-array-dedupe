[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "json-array-dedupe"
version = "1.0.0"
description = "Deduplicate elements of a JSON array with deep structural equality."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "TataneSan"}]
requires-python = ">=3.9"
keywords = ["json", "dedupe", "cli", "arrays"]

[project.scripts]
json-array-dedupe = "json_array_dedupe.cli:main"

[tool.setuptools]
packages = ["json_array_dedupe"]
