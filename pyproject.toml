[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "json-array-dedupe"
version = "1.0.0"
description = "Remove duplicate elements from arrays inside JSON/JSONL documents (stable)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "TataneSan"}]

[project.scripts]
json-array-dedupe = "json_array_dedupe.cli:main"

[tool.setuptools]
packages = ["json_array_dedupe"]
